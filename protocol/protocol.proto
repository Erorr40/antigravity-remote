syntax = "proto3";

package antigravity.remote.v1;

option go_package = "antigravity/remote/v1;remotev1";

// -----------------------------------------------------------------------------
// Envelope & Transport (Outer Layer)
// -----------------------------------------------------------------------------

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  HEARTBEAT_PING = 1;
  HEARTBEAT_PONG = 2;
  PAIRING_REQUEST = 3;
  PAIRING_RESPONSE = 4;
  KEY_EXCHANGE_INIT = 5;
  KEY_EXCHANGE_ACK = 6;
  ENCRYPTED_CONTAINER = 10;
  RELAY_ERROR = 99;
}

message RelayEnvelope {
  string message_id = 1;
  int64 timestamp_ms = 2;
  MessageType type = 3;
  string sender_id = 4;
  string target_id = 5;
  
  // Cleartext payload for pre-handshake routing (handshakes/heartbeats)
  bytes plain_payload = 6;
  
  // End-to-End Encrypted container (when type == ENCRYPTED_CONTAINER)
  EncryptedPayload encrypted_payload = 7;
}

message EncryptedPayload {
  string sender_key_id = 1;
  bytes nonce = 2;              // 12-byte IV for AES-GCM or 24-byte nonce for XChaCha20
  bytes ciphertext = 3;         // Encrypted InnerMessage bytes + 16-byte auth tag
  int64 sequence_number = 4;    // Anti-replay protection sequence
}

// -----------------------------------------------------------------------------
// Handshake & Pairing
// -----------------------------------------------------------------------------

message PairingPayload {
  string pair_token = 1;
  string mobile_device_id = 2;
  string device_name = 3;
  bytes mobile_public_key = 4; // Curve25519 (X25519) public key
}

message PairingResponse {
  bool success = 1;
  string error_message = 2;
  string host_device_id = 3;
  bytes host_public_key = 4;   // Host X25519 public key
  bytes session_salt = 5;
}

// -----------------------------------------------------------------------------
// Inner Decrypted Message (End-to-End Encrypted Body)
// -----------------------------------------------------------------------------

enum InnerActionType {
  ACTION_UNSPECIFIED = 0;
  
  // Session queries
  REQ_SESSION_LIST = 1;
  RESP_SESSION_LIST = 2;
  
  // Transcript streaming & sync
  REQ_TRANSCRIPT_SYNC = 10;
  RESP_TRANSCRIPT_SNAPSHOT = 11;
  EVT_TRANSCRIPT_DELTA = 12;
  
  // Remote Control / Dispatch
  CMD_DISPATCH_PROMPT = 20;
  CMD_ABORT_TASK = 21;
  CMD_SEND_TOOL_INPUT = 22;
  RESP_COMMAND_ACK = 23;
  
  // Artifacts & Files
  REQ_ARTIFACT_LIST = 30;
  RESP_ARTIFACT_LIST = 31;
  REQ_ARTIFACT_CONTENT = 32;
  RESP_ARTIFACT_CONTENT = 33;
}

message InnerMessage {
  string inner_id = 1;
  int64 timestamp_ms = 2;
  InnerActionType action = 3;
  string session_id = 4;       // Antigravity conversation ID
  
  oneof payload {
    SessionListRequest session_list_req = 10;
    SessionListResponse session_list_resp = 11;
    TranscriptSyncRequest transcript_sync_req = 12;
    TranscriptSnapshotResponse transcript_snapshot_resp = 13;
    TranscriptDeltaEvent transcript_delta_evt = 14;
    DispatchPromptCommand dispatch_prompt_cmd = 15;
    AbortTaskCommand abort_task_cmd = 16;
    ToolInputCommand tool_input_cmd = 17;
    CommandAckResponse command_ack = 18;
    ArtifactListRequest artifact_list_req = 19;
    ArtifactListResponse artifact_list_resp = 20;
    ArtifactContentRequest artifact_content_req = 21;
    ArtifactContentResponse artifact_content_resp = 22;
  }
}

// -----------------------------------------------------------------------------
// Sessions & Heartbeat
// -----------------------------------------------------------------------------

message HostStatus {
  bool online = 1;
  string host_os = 2;
  string active_session_id = 3;
  int32 active_tasks_count = 4;
  string host_version = 5;
  int64 uptime_seconds = 6;
}

message SessionInfo {
  string session_id = 1;
  string project_dir = 2;
  int64 created_at_ms = 3;
  int64 updated_at_ms = 4;
  int32 total_steps = 5;
  string last_user_prompt = 6;
  string last_agent_status = 7; // e.g. "idle", "thinking", "tool_executing", "waiting_for_input"
  bool has_active_task = 8;
}

message SessionListRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message SessionListResponse {
  repeated SessionInfo sessions = 1;
}

// -----------------------------------------------------------------------------
// Transcripts & Real-Time Streaming
// -----------------------------------------------------------------------------

enum StepSource {
  STEP_SOURCE_UNSPECIFIED = 0;
  USER_EXPLICIT = 1;
  MODEL = 2;
  SYSTEM = 3;
}

enum StepType {
  STEP_TYPE_UNSPECIFIED = 0;
  USER_INPUT = 1;
  PLANNER_RESPONSE = 2;
  TOOL_RESULT = 3;
}

message ToolCall {
  string tool_name = 1;
  string tool_action = 2;
  string tool_summary = 3;
  string call_id = 4;
  string arguments_json = 5;
  string result_json = 6;
  bool is_error = 7;
}

message TranscriptStep {
  int32 step_index = 1;
  StepSource source = 2;
  StepType type = 3;
  string status = 4;              // "DONE", "ERROR", "RUNNING"
  string created_at = 5;          // ISO 8601 string
  string content = 6;             // Final user prompt or model text response
  string thinking = 7;            // Chain of thought / reasoning
  repeated ToolCall tool_calls = 8;
  repeated string truncated_fields = 9;
}

message TranscriptSyncRequest {
  string session_id = 1;
  int32 from_step_index = 2;      // 0 for full history
}

message TranscriptSnapshotResponse {
  string session_id = 1;
  repeated TranscriptStep steps = 2;
  bool is_live = 3;
}

enum DeltaKind {
  DELTA_APPEND_STEP = 0;
  DELTA_UPDATE_STEP = 1;
  DELTA_STREAM_THINKING = 2;
  DELTA_STREAM_CONTENT = 3;
}

message TranscriptDeltaEvent {
  string session_id = 1;
  DeltaKind kind = 2;
  int32 step_index = 3;
  
  // Streaming text delta for live thinking or content typing
  string text_chunk = 4;
  
  // Full or updated step when completing a chunk or tool call
  TranscriptStep step = 5;
}

// -----------------------------------------------------------------------------
// Remote Commands
// -----------------------------------------------------------------------------

message DispatchPromptCommand {
  string session_id = 1;
  string prompt = 2;
  bool create_new_session = 3;
  string optional_model = 4;
}

message AbortTaskCommand {
  string session_id = 1;
  string task_id = 2;            // Empty to abort current root agent run
  string reason = 3;
}

message ToolInputCommand {
  string session_id = 1;
  string call_id = 2;
  string action = 3;             // "approve", "reject", "send_input"
  string input_text = 4;
}

message CommandAckResponse {
  string request_id = 1;
  bool success = 2;
  string message = 3;
  int64 timestamp_ms = 4;
}

// -----------------------------------------------------------------------------
// Artifacts & Files
// -----------------------------------------------------------------------------

message ArtifactInfo {
  string file_name = 1;
  string file_path = 2;
  int64 size_bytes = 3;
  int64 modified_at_ms = 4;
  string mime_type = 5;
}

message ArtifactListRequest {
  string session_id = 1;
}

message ArtifactListResponse {
  string session_id = 1;
  repeated ArtifactInfo artifacts = 2;
}

message ArtifactContentRequest {
  string session_id = 1;
  string file_name = 2;
}

message ArtifactContentResponse {
  string session_id = 1;
  string file_name = 2;
  string mime_type = 3;
  bytes content = 4;
}
